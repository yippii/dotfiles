# Web
windowrule = match:class firefox|zen.*, workspace 1
#windowrule = match:class zen, opacity 0.9

# Communication
windowrule = match:class discord|equibop|vesktop|whatsapp, workspace 2

# Musik
windowrule = match:initial_title Spotify( Free)?, workspace 3
windowrule = match:class feishin|Spotify|Supersonic|io.github.quodlibet.QuodLibet, workspace 3
windowrule = match:class io.github.quodlibet.QuodLibet, workspace 3

# IDE
windowrule {
  name = IDEs
  match:initial_class = code
  workspace = 4
}

windowrule {
  name = Zed Transparent
  match:initial_class = dev.zed.Zed
  workspace = 4
  opacity = 0.8
}

# Game
windowrule {
  name = Game (Class)
  match:initial_class = steam*|Quaver|org.vinegarhq.Sober
  workspace = 5
}


windowrule {
  name = Game (Title)
  match:initial_title = Sober|Wuthering Waves|Endfield\.exe|GRYPHLINK|HELLDIVERS.*|Strinova.*
  workspace = 5
  fullscreen = 1
}

# Terminal
windowrule = match:class kitty, workspace 6

# Blur Shell
layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.4
  blur = true
  blur_popups = true
}

windowrule {
  name = floaties
  match:initial_class = xdg-desktop-portal-gtk
  float = true
}
