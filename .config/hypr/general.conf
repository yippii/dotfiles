input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
      natural_scroll = yes
	    tap-to-click = false
			clickfinger_behavior = true
	    drag_3fg = false
      disable_while_typing = false
   } 
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
    allow_tearing = false
}

gesture = 3, horizontal, scale: 1.1, workspace

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 4
        new_optimizations = true
        ignore_opacity = true
    }
}

animations {
    enabled = true
    bezier = linear, 0, 0, 1, 1
    bezier = winIn, 0.07, 0.88, 0.04, 0.99
    bezier = menu_decel, 0.05, 0.82, 0, 1
    bezier = menu_accel, 0.38, 0, 1, 1
    bezier = md3_decel, 0.05, 0.8, 0.1, 0.97
    bezier = easeOutCirc, 0, 0.48, 0.38, 1

    animation = windowsIn, 1, 3.2, winIn, slide
    animation = windowsOut, 1, 2.8, easeOutCirc, slide
    animation = windowsMove, 1, 3.0, md3_decel, slide

    animation = fade, 1, 1.8, md3_decel
    animation = layersIn, 1, 1.8, menu_decel, slide
    animation = layersOut, 1, 1.5, menu_accel, slide

    animation = workspaces, 1, 4.0, menu_decel, slidefade 20%
    animation = specialWorkspace, 1, 2.3, md3_decel, slidefadevert 15%
}

dwindle {
    preserve_split = yes
}

xwayland {
  force_zero_scaling = true
}

misc {
    force_default_wallpaper = 0
}

debug {
    disable_scale_checks = true 
    full_cm_proto = true
    disable_logs = false
    enable_stdout_logs = true
}

