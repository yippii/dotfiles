name: Update flake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'yippii/dotfiles-private' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake update --flake ./nixos
      - run: nix flake update --flake ./darwin
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(flake): update flake.lock"
